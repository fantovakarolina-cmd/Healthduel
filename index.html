<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Health Duel 🧘‍♀️ Solo</title>
    
    <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body class="solo-active"> <div class="app">
    
    <div class="header">
        <div class="logo">Health Duel</div>
        <div id="date-display" class="logo-date">---</div>
    </div>

    <div class="system-actions">
        <button id="solo-toggle-btn" onclick="toggleSoloMode()" class="btn-solo">
            ⚔️ Zpět na Duel
        </button>
        <div class="actions-group">
            <button onclick="forceRefresh()" class="btn-icon">🔄</button>
            <button onclick="logoutUser()" class="btn-icon">🚪</button>
        </div>
    </div>

    <div class="solo-card">
        <div class="card-left">
            <div id="streak-counter" class="streak-count">---</div>
            <div id="streak-label" class="streak-label">---</div>
        </div>
        <div class="card-right">
            <div class="card-pts">
                <span id="score-userA">0</span>
                <span class="pts-label">bodů</span>
            </div>
            <div class="user-identity">
                <span id="label-userA">Lůca</span>
            </div>
        </div>
    </div>

    <div class="quest-card weekly-challenge">
        <div class="quest-top">
            <div id="weekly-title" class="quest-label">---</div>
            <div id="weekly-goal-val" class="quest-pts">---</div>
        </div>
        <div class="track-bg solo-bar">
            <div id="bar-a" class="track-fill bar-fill-solo" style="width:0%"></div>
        </div>
        <div class="bar-legend">
            <span>Po</span>
            <span style="opacity:0.6">Čt</span>
            <span>Ne</span>
        </div>
    </div>

    <div class="section-title">✅ Dnešní návyky</div>
    <div id="habit-list" class="habit-list">
        </div>

    <div class="quest-card side-quest">
        <div class="quest-top">
            <div class="quest-label">⚡ Side Quest dne</div>
            <div class="quest-pts">+15</div>
        </div>
        <div id="today-quest" class="quest-text">Načítám...</div>
        <button id="quest-btn" class="quest-btn" onclick="completeQuest()">Splnit výzvu</button>
    </div>

    <div class="section-title">📋 Dnešní akce</div>
    <div class="log-card" style="margin-bottom: 40px;">
        <div id="log-list"><div class="log-empty">Zatím žádné akce dnes…</div></div>
    </div>

</div>

<script type="module" src="script.js"></script>

</body>
</html>
